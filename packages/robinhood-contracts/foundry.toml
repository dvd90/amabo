[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes deployments/4663.json in this package.
fs_permissions = [{ access = "read-write", path = "deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 64

# VERIFY: Robinhood Chain (4663) RPC + Blockscout URLs come from env, never hardcoded.
# Set ROBINHOOD_RPC_URL / ROBINHOOD_BLOCKSCOUT_API_URL from official Robinhood Chain docs.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "${ROBINHOOD_BLOCKSCOUT_API_URL}" }
