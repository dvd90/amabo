[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes deployments/4663.json in this package.
fs_permissions = [{ access = "read-write", path = "deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 64

# Robinhood Chain (4663) RPC + Blockscout URLs come from env, never hardcoded. Verified values
# (docs.robinhood.com/chain/connecting, 2026-08-31): RPC https://rpc.mainnet.chain.robinhood.com
# (public, rate-limited; Alchemy et al. for production), explorer https://robinhoodchain.blockscout.com
# (API URL: https://robinhoodchain.blockscout.com/api). Testnet: 46630, https://rpc.testnet.chain.robinhood.com/rpc.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "${ROBINHOOD_BLOCKSCOUT_API_URL}" }
